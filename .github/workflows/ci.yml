name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Native modules (better-sqlite3, keytar) get rebuilt for the Electron
        # ABI via the package's `postinstall` hook (electron-builder install-app-deps).
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Benchmarks (Tier A — PRD §11 budgets)
        # Headless micro-benchmarks: suggestions <100ms, 20-track build <500ms,
        # import-parse canary. The full SQLite import auto-skips here because
        # better-sqlite3 is built for the Electron ABI (see import.bench.test.ts);
        # it runs in the nightly job. Fails the build on a budget breach.
        run: npm run bench:node

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-node-results
          path: bench/results/node-latest.json
          if-no-files-found: ignore

      - name: Build (renderer + main, no installer)
        run: npm run build

      - name: Smoke test — app actually launches & renders
        # Opens the built app via Playwright's Electron driver and asserts the
        # renderer mounts with no boot error. Catches packaging/boot breakage that
        # unit tests never exercise. The ~1.9GB model is not needed (loads lazily).
        run: npm run test:smoke
